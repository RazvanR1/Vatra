name: Stats

# Zilnic: instalările Vatra din statisticile oficiale Home Assistant și traficul repo-ului,
# salvate pe branch-ul `stats` (nu pe main). De acolo citesc badge-ul din README și senzorul din HA.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: main

      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}" stats >/dev/null; then
            git clone --depth 1 --branch stats "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" stats
          else
            mkdir stats && cd stats && git init -b stats \
              && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            printf '# Vatra stats\n\nDaily statistics generated by the Stats workflow. Not part of the add-on.\n' > README.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect
        run: python3 main/.github/scripts/stats.py stats
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Commit
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "stats $(date -u +%F)"
          git push origin stats
