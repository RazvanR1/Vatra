name: Release

# After the images of a new version are built and published, create the GitHub release
# (tag v<version>, notes from CHANGELOG.md). People who watch the repo get notified.
on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Create the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(grep -m1 '^version:' ha_home_brain/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists"; exit 0
          fi
          python3 .github/scripts/release_notes.py "$version" > notes.md
          title=$(head -1 notes.md); tail -n +3 notes.md > body.md
          gh release create "v$version" --target "$SHA" --title "$title" --notes-file body.md --latest
