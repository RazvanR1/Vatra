name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ha_home_brain/requirements.txt pytest pytest-asyncio pyyaml
      - run: python -c "import yaml; yaml.safe_load(open('ha_home_brain/config.yaml'))"
      - run: pytest -q

  integration:
    name: Assist integration (custom_components/vatra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - name: Conversation requirements matching the installed Home Assistant
        run: |
          python - <<'PY' > conv-req.txt
          import importlib.util, json, pathlib
          ha = pathlib.Path(importlib.util.find_spec("homeassistant").submodule_search_locations[0])
          print("\n".join(json.loads((ha / "components/conversation/manifest.json").read_text())["requirements"]))
          PY
          pip install -r conv-req.txt
      - run: pytest -q tests_ha -p no:cacheprovider
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # Informativ: descrierea și topic-urile repo-ului se setează din GitHub (About), nu din cod.
    continue-on-error: true
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
