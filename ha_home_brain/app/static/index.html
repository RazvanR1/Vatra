<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vatra – the local brain for Home Assistant</title>
<style>
  :root { --bg:#111418; --card:#1a1f25; --line:#2a313a; --text:#e6e9ee; --muted:#8b95a3;
          --ok:#3fb27f; --warn:#e0a63a; --crit:#e5534b; --accent:#4c9aff; --chip:#232a33; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); }
  .bar { max-width:1040px; margin:0 auto; padding:12px 16px 0; display:flex; align-items:center; gap:10px; }
  h1 { font-size:19px; margin:0; } #meta { color:var(--muted); margin-left:auto; font-size:13px; }
  nav { max-width:1040px; margin:0 auto; padding:8px 12px 0; display:flex; gap:2px; overflow-x:auto; }
  nav button { background:none; border:0; color:var(--muted); padding:8px 12px; border-bottom:2px solid transparent;
               font:inherit; cursor:pointer; white-space:nowrap; border-radius:0; }
  nav button.on { color:var(--text); border-bottom-color:var(--accent); }
  .tier { border:1px solid currentColor; border-radius:9px; padding:0 6px; font-size:11px; opacity:.7; margin-left:4px; }
  .badge { background:var(--crit); color:#fff; border-radius:9px; padding:0 6px; font-size:12px; margin-left:4px; }
  main { max-width:1040px; margin:0 auto; padding:16px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
       display:flex; align-items:center; gap:8px; }
  h2 .sp { margin-left:auto; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--crit); }
  .item { padding:10px 0; border-top:1px solid var(--line); } .item:first-of-type { border-top:0; }
  .item small, .muted { color:var(--muted); }
  .item small { display:block; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .warning { border-left:3px solid var(--warn); padding-left:10px; }
  .critical { border-left:3px solid var(--crit); padding-left:10px; }
  .info { border-left:3px solid var(--ok); padding-left:10px; }
  .stat { font-size:26px; font-weight:600; } .stat + small { color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .chip { display:inline-block; background:var(--chip); border-radius:6px; padding:1px 7px; font-size:12px; color:var(--muted); }
  .empty { color:var(--muted); }
  button { padding:7px 12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit;
           font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.no { background:transparent; border:1px solid #5a2a2a; color:#f0a5a0; }
  #log { height:52vh; overflow:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .msg { padding:8px 11px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#24466f; } .bot { align-self:flex-start; background:#232a33; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0d1014;
          color:var(--text); font:inherit; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#2b3440; padding:10px 16px;
           border-radius:10px; display:none; max-width:90%; }
  .tab { display:none; } .tab.on { display:block; }
  .setup label.opt { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .setup label.opt:first-of-type { border-top:0; }
  .setup label.opt span { flex:1; } .setup label.opt small { color:var(--muted); }
  input[type=checkbox] { flex:0 0 auto; width:18px; height:18px; padding:0; accent-color:var(--accent); }
  select, textarea { padding:9px; border-radius:8px; border:1px solid var(--line); background:#0d1014; color:var(--text); font:inherit; }
  textarea { width:100%; min-height:80px; resize:vertical; }
  .field { display:flex; flex-direction:column; gap:5px; margin:10px 0; } .field > span { color:var(--muted); font-size:13px; }
  .found { cursor:pointer; } .found:hover { color:var(--text); }
  .notice { border:1px solid var(--accent); border-radius:12px; padding:12px 14px; margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #overlay { position:fixed; inset:0; background:rgba(10,12,15,.85); display:none; align-items:center; justify-content:center; z-index:5; font-size:17px; }
  @media (max-width:640px) { #sub { display:none; } #meta { font-size:12px; } }
  #lang { background:transparent; border:1px solid var(--line); color:var(--muted); padding:3px 8px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="bar"><span id="conn" class="dot"></span><h1>🔥 Vatra</h1><span id="sub" class="muted" style="font-size:13px">the local brain for Home Assistant</span><span id="meta"></span>
    <button id="lang" title="Language / Limba">EN</button></div>
  <nav id="nav">
    <button data-t="home" class="on" data-i18n="nav.home"></button>
    <button data-t="approvals"><span data-i18n="nav.approvals"></span><span id="nb" class="badge" hidden></span></button>
    <button data-t="habits" data-i18n="nav.habits"></button>
    <button data-t="unusual" data-i18n="nav.unusual"></button>
    <button data-t="agents" data-i18n="nav.agents"></button>
    <button data-t="jarvis">Jarvis</button>
    <button data-t="log" data-i18n="nav.log"></button>
    <button data-t="setup" data-i18n="nav.setup"></button>
  </nav>
</header>
<main>
  <div class="tab on" id="t-home">
    <div class="notice" id="setup-notice" hidden><span style="flex:1" data-i18n="su.notice"></span>
      <button onclick="document.querySelector('[data-t=setup]').click()" data-i18n="su.open"></button></div>
    <section><h2 data-i18n="h.summary"></h2><div class="stats" id="stats"></div></section>
    <div class="grid">
      <section><h2 data-i18n="h.alerts"></h2><div id="alerts"></div></section>
      <section><h2 data-i18n="h.recent"></h2><div id="recent-ins"></div></section>
    </div>
    <section><h2 data-i18n="h.rules"></h2><div id="rules"></div></section>
  </div>

  <div class="tab" id="t-approvals">
    <section><h2 data-i18n="h.approvals"></h2><div id="approvals"></div></section>
  </div>

  <div class="tab" id="t-habits">
    <section><h2><span data-i18n="h.habits"></span> <button class="ghost sp" onclick="post('api/learn').then(loadHabits)" data-i18n="b.relearn"></button></h2>
      <p class="muted" style="margin-top:0" data-i18n="p.habits"></p>
      <div id="habits"></div></section>
    <section><h2 data-i18n="h.habits_other"></h2><div id="habits-other"></div></section>
  </div>

  <div class="tab" id="t-unusual">
    <section><h2 data-i18n="h.unusual"></h2><div id="findings"></div></section>
    <section><h2 data-i18n="h.explained"></h2><div id="explained"></div></section>
    <section><h2 data-i18n="h.guard"></h2><div id="history"></div>
      <small id="ntf"></small>
      <div class="row"><button class="ghost" onclick="post('api/test-notify').then(()=>toast(T('sent')))" data-i18n="b.test"></button></div></section>
  </div>

  <div class="tab" id="t-agents">
    <section><h2 data-i18n="nav.agents"></h2><div id="agents"></div></section>
    <section><h2 data-i18n="h.insights"></h2><div id="insights"></div></section>
  </div>

  <div class="tab" id="t-jarvis">
    <section><h2>Jarvis</h2><div id="log"></div>
      <form id="chat"><input id="q" autocomplete="off"><button data-i18n="b.send"></button></form>
    </section>
  </div>

  <div class="tab" id="t-log">
    <section><h2 data-i18n="h.done"></h2><div id="done"></div></section>
    <section><h2 data-i18n="nav.log"></h2><div id="activity"></div></section>
  </div>
  <div class="tab setup" id="t-setup">
    <section><h2 data-i18n="su.title"></h2><p class="muted" style="margin:0" data-i18n="su.intro"></p>
      <p class="muted" id="su-nosave" hidden data-i18n="su.nosave"></p></section>
    <div class="grid">
      <section><h2>1 · <span data-i18n="su.phones"></span></h2><p class="muted" style="margin-top:0" data-i18n="su.phones_p"></p>
        <div id="su-notify"></div>
        <div class="row"><input id="su-notify-add" placeholder="notify.mobile_app_…"><button class="ghost" onclick="addNotify()" data-i18n="su.add"></button></div></section>
      <section><h2>2 · <span data-i18n="su.people"></span></h2><p class="muted" style="margin-top:0" data-i18n="su.people_p"></p>
        <div id="su-persons"></div></section>
    </div>
    <section><h2>3 · <span data-i18n="su.ai"></span></h2><p class="muted" style="margin-top:0" data-i18n="su.ai_p"></p>
      <div class="row"><button class="ghost" id="su-scan" onclick="discoverAI(this)" data-i18n="su.scan"></button></div>
      <div id="su-found" class="row"></div>
      <label class="field"><span data-i18n="su.backend"></span>
        <select id="su-backend" onchange="aiBackend()"><option value="ollama">Ollama</option>
          <option value="openai" data-i18n="su.openai"></option></select></label>
      <label class="field"><span data-i18n="su.url"></span><input id="su-url" placeholder="http://192.168.1.50:11434"></label>
      <label class="field" id="su-key-f"><span data-i18n="su.key"></span><input id="su-key" type="password" autocomplete="off"></label>
      <div class="row"><button class="ghost" onclick="testAI(this)" data-i18n="su.test_ai"></button><small id="su-ai-res" class="muted" style="align-self:center"></small></div>
      <label class="field"><span data-i18n="su.model"></span><input id="su-model" list="su-models" placeholder="qwen3.5:9b"><datalist id="su-models"></datalist></label>
      <label class="field" id="su-ctx-f"><span data-i18n="su.ctx"></span><input id="su-ctx" type="number" min="2048" step="1024"></label>
    </section>
    <section><h2>4 · <span data-i18n="su.home"></span></h2>
      <label class="field"><span data-i18n="su.home_p"></span><textarea id="su-site"></textarea></label>
      <label class="field"><span data-i18n="su.lang"></span><select id="su-lang"><option value="auto">Auto (Home Assistant)</option><option value="en">English</option><option value="ro">Română</option></select></label>
    </section>
    <section><div class="row" style="margin:0"><button id="su-save" onclick="saveSetup()" data-i18n="su.save"></button>
      <button class="ghost" onclick="post('api/setup/dismiss').then(()=>{S.needs_setup=false;render();document.querySelector('[data-t=home]').click()})" data-i18n="su.later"></button></div>
      <small class="muted" style="display:block;margin-top:8px" data-i18n="su.advanced"></small></section>
  </div>
</main>
<div id="overlay"><span data-i18n="su.restarting"></span></div>
<div id="toast"></div>

function setLang(l, save) {
  LANG = L[l] ? l : "en";
  if (save) { try { localStorage.setItem("vatra_lang", LANG); } catch (e) {} }
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));
  $("lang").textContent = LANG === "ro" ? "RO → EN" : "EN → RO";
  $("q").placeholder = T(S.assistant && !S.assistant.enabled ? "q.off" : "q");
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = t => t ? new Date(typeof t === "number" ? t*1000 : t).toLocaleString(LANG === "ro" ? "ro-RO" : undefined) : "—";
const get = p => fetch(p).then(r => r.json());
const post = (p, b) => fetch(p, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b||{})})
  .then(r => r.json()).then(r => { if (r && r.message) toast(r.message); return r; });
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 4000); }
const empty = t => `<div class="empty">${t}</div>`;

$("lang").onclick = () => { setLang(LANG === "ro" ? "en" : "ro", true); render(); const on = document.querySelector("#nav button.on"); on && on.click(); };
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.id === "t-" + b.dataset.t));
  ({approvals: loadApprovals, habits: loadHabits, agents: loadAgents, log: loadLog, setup: loadSetup})[b.dataset.t]?.();
});

let S = {};
async function refresh() {
  try { S = await get("api/status"); } catch (e) { $("conn").className = "dot bad"; return; }
  if (!LANG) { let saved = null; try { saved = localStorage.getItem("vatra_lang"); } catch (e) {} setLang(saved || S.language || "en"); }
  render();
}
function render() {
  $("conn").className = "dot " + (S.connected ? "ok" : "bad");
  $("meta").textContent = S.connected ? T("entities", {n: S.entities}) : T("disconnected");
  $("nb").hidden = !S.pending; $("nb").textContent = S.pending;
  const m = S.memory || {};
  $("stats").innerHTML = [
    [m.transitions ?? 0, "s.transitions"], [m.days ?? 0, "s.days"],
    [S.pending ?? 0, "s.pending"], [(S.findings||[]).length, "s.findings"],
    [S.llm?.calls ?? 0, "s.ai"], [m.import ? T("imp." + m.import) : "—", "s.import"],
  ].map(([v, l]) => `<div><div class="stat">${esc(v)}</div><small>${esc(T(l))}</small></div>`).join("");
  $("alerts").innerHTML = (S.active_alerts||[]).length ? S.active_alerts.map(alertRow).join("") : empty(T("all_ok"));
  $("rules").innerHTML = (S.automations||[]).map(r => `<div class="item">${esc(r.name)}<small>${r.enabled ? esc(r.last_action) : T("rule_off")}</small></div>`).join("");
  $("history").innerHTML = (S.history||[]).length ? S.history.map(alertRow).join("") : empty(T("nothing_yet"));
  $("findings").innerHTML = (S.findings||[]).length ? S.findings.map(f => `<div class="item ${esc(f.level)}">${esc(f.title)} <span class="tier">${esc(f.tier_label || "")}</span><small>${esc(f.message)}${f.context ? " · " + esc(f.context) : ""}</small></div>`).join("")
    : empty(m.last_learning ? T("nothing_unusual") : T("learning"));
  const ex = Object.entries(S.explained || {});
  $("explained").innerHTML = ex.length ? ex.map(([e, why]) => `<div class="item">${esc(e)}<small>${esc(why)}</small></div>`).join("") : empty(T("nothing"));
  const N = S.notifications || {};
  if (N.mode) $("ntf").textContent = T("ntf", {mode: N.mode, quiet: N.quiet_hours, sent: N.sent_today, max: N.max_per_day, queued: N.queued});
  $("setup-notice").hidden = !S.needs_setup;
  if (!refresh.opened && S.needs_setup && location.hash !== "#home") { refresh.opened = true; document.querySelector('[data-t="setup"]')?.click(); }
  if (!refresh.opened && S.pending > 0 && location.hash !== "#home") { refresh.opened = true; document.querySelector('[data-t="approvals"]')?.click(); }
  refresh.opened = true;
  $("q").placeholder = T(S.assistant && !S.assistant.enabled ? "q.off" : "q");
  if (document.querySelector("#t-home.on")) get("api/insights").then(r => $("recent-ins").innerHTML = r.length ? r.slice(0,5).map(insRow).join("") : empty(T("agents_not_run")));
}
const alertRow = a => `<div class="item ${esc(a.level)}">${esc(a.title)}<small>${esc(a.message)} · ${when(a.time)}</small></div>`;
const insRow = i => `<div class="item ${esc(i.severity)}"><span class="chip">${esc(i.agent_name)}</span> ${esc(i.title)}<small>${esc(i.detail)}</small></div>`;

async function loadApprovals() {
  const r = await get("api/approvals");
  $("approvals").innerHTML = r.length ? r.map(a => `<div class="item">${esc(a.title)}<small>${esc(a.message)}</small>
    <div class="row">${(a.buttons||[]).map(([d, t]) => `<button class="${d==="no"||d==="mute"?"no":d==="ok"?"":"ghost"}" onclick="decide('${a.id}','${d}')">${esc(t)}</button>`).join("")}</div></div>`).join("")
    : empty(T("no_approvals"));
}
window.decide = (id, d) => post(`api/approvals/${id}/${d}`).then(() => { loadApprovals(); refresh(); });

async function loadHabits() {
  const r = await get("api/habits");
  const act = r.filter(h => ["new","proposed"].includes(h.status));
  const oth = r.filter(h => !["new","proposed"].includes(h.status));
  const row = h => `<div class="item">${esc(h.description)}
    <small><span class="chip">${esc(T("st." + h.status))}</span> ${T("confidence", {n: Math.round(h.confidence*100)})} ·
    ${T("backtest", {h: h.backtest?.hits ?? 0, f: h.backtest?.fired ?? 0})}${h.backtest?.extra ? ", " + T("extra", {n: h.backtest.extra}) : ""}
    ${h.covered_by ? " · " + esc(T("covered_by", {n: h.covered_by})) : ""}${h.require_home ? " · " + T("home_only") : ""}</small>
    <div class="row">${["new","proposed"].includes(h.status) ? `<button onclick="habit('${h.id}','create')">${T("b.create")}</button>
      <button class="ghost" onclick="habit('${h.id}','propose')">${T("b.propose")}</button>
      <button class="no" onclick="habit('${h.id}','reject')">${T("b.not_habit")}</button>`
      : h.status === "rejected" ? `<button class="ghost" onclick="habit('${h.id}','restore')">${T("b.restore")}</button>` : ""}</div></div>`;
  $("habits").innerHTML = act.length ? act.map(row).join("") : empty(S.memory?.last_learning ? T("no_habits") : T("habits_learning"));
  $("habits-other").innerHTML = oth.length ? oth.map(row).join("") : empty("—");
}
window.habit = (id, a) => post(`api/habits/${id}/${a}`).then(loadHabits);

const skipped = s => s.startsWith("AI:") ? s : T("sk." + s);
async function loadAgents() {
  const ag = S.agents || {};
  $("agents").innerHTML = Object.keys(ag).length ? Object.entries(ag).map(([k, s]) => `<div class="item">${esc(T("ag." + k))}
    <small>${T("last_run", {t: when(s.last_run)})}${s.skipped ? " · " + esc(skipped(s.skipped)) : " · " + T("ran", {n: s.insights ?? 0, s: s.seconds ?? "?"})}</small>
    <div class="row"><button class="ghost" onclick="runAgent('${k}', this)">${T("b.run")}</button></div></div>`).join("")
    : empty(T("agents_off"));
  const r = await get("api/insights");
  $("insights").innerHTML = r.length ? r.map(insRow).join("") : empty(T("no_insights"));
}
window.runAgent = (k, b) => { b.disabled = true; b.textContent = T("running"); post(`api/agents/${k}/run`).then(() => { refresh().then(loadAgents); }); };

async function loadLog() {
  const d = await get("api/done");
  $("done").innerHTML = d.length ? d.map(x => `<div class="item">${esc(x.name)} – ${esc(x.service)} <span class="chip">${esc(x.source)}</span>
    <small>${esc(x.reason||"")} · ${when(x.ts)} ${x.status === "undone" ? T("undone") : ""}</small>
    ${x.status === "done" ? `<div class="row"><button class="ghost" onclick="post('api/undo/${x.id}').then(loadLog)">${T("b.undo")}</button></div>` : ""}</div>`).join("") : empty(T("nothing_yet"));
  const a = await get("api/activity");
  $("activity").innerHTML = a.length ? a.map(x => `<div class="item"><span class="chip">${esc(T("k." + x.kind))}</span> ${esc(x.message)}<small>${when(x.ts)}</small></div>`).join("") : empty(T("nothing_yet"));
}

function say(text, who) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; $("log").appendChild(d); $("log").scrollTop = 1e9; return d; }
$("chat").onsubmit = async e => {
  e.preventDefault(); const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; say(q, "me"); const w = say("…", "bot");
  try { const r = await (await fetch("api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message:q})})).json();
    let t = r.reply; if (r.actions?.length) t += "\n✓ " + r.actions.join("\n✓ "); if (r.refused?.length) t += "\n✗ " + r.refused.join("\n✗ ");
    w.textContent = t; } catch (err) { w.textContent = T("error") + err; }
};

// ---------- ghid de pornire ----------
let SU = null;
const checks = (id, items, sel, key, label, none) => $(id).innerHTML = items.length ? items.map(i => `<label class="opt">
  <input type="checkbox" value="${esc(i[key])}" ${sel.includes(i[key]) ? "checked" : ""}><span>${esc(i[label])}<small> · ${esc(i[key])}</small></span>
  ${key === "service" ? `<button class="ghost" type="button" onclick="testNotify('${esc(i[key])}')">${T("su.test")}</button>` : ""}</label>`).join("") : empty(T(none));
async function loadSetup() {
  SU = await get("api/setup");
  const o = SU.options, a = o.assistant || {}, d = SU.detected;
  $("su-nosave").hidden = SU.can_save;
  const notify = [...d.notify]; o.notify_services.forEach(s => notify.some(n => n.service === s) || notify.push({service: s, name: s.replace("notify.", "")}));
  // Primul pornire: bifăm din oficiu telefoanele și persoanele găsite.
  const fresh = !o.notify_services.length && !o.persons.length;
  checks("su-notify", notify, fresh ? d.notify.filter(n => n.service !== "notify.persistent_notification").map(n => n.service) : o.notify_services, "service", "name", "su.none_phone");
  const persons = [...d.persons]; o.persons.forEach(p => persons.some(x => x.entity_id === p) || persons.push({entity_id: p, name: p}));
  checks("su-persons", persons, fresh ? d.persons.map(p => p.entity_id) : o.persons, "entity_id", "name", "su.none_person");
  $("su-backend").value = a.backend || "ollama";
  $("su-url").value = (a.backend === "openai" ? a.openai_url : a.ollama_url) || "";
  $("su-key").value = ""; $("su-key").placeholder = a.has_key ? T("su.key_saved") : "";
  $("su-model").value = a.model || ""; $("su-ctx").value = a.num_ctx || 8192;
  $("su-site").value = o.site_context || ""; $("su-lang").value = o.language || "auto";
  aiBackend(true);
}
window.aiBackend = keep => {
  const ol = $("su-backend").value === "ollama";
  $("su-ctx-f").hidden = !ol;
  $("su-url").placeholder = ol ? "http://192.168.1.50:11434" : "http://192.168.1.50:1234/v1";
  if (keep !== true && SU) { const a = SU.options.assistant || {}; $("su-url").value = (ol ? a.ollama_url : a.openai_url) || ""; }
};
window.addNotify = () => {
  const v = $("su-notify-add").value.trim(); if (!v) return;
  const svc = v.startsWith("notify.") ? v : "notify." + v;
  SU.detected.notify.push({service: svc, name: svc.replace("notify.", "")});
  SU.options.notify_services = [...collect("su-notify"), svc]; $("su-notify-add").value = "";
  checks("su-notify", SU.detected.notify, SU.options.notify_services, "service", "name", "su.none_phone");
};
window.testNotify = svc => post("api/setup/test-notify", {service: svc});
const collect = id => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
function fillModels(models) { $("su-models").innerHTML = models.map(m => `<option value="${esc(m)}">`).join(""); if (!$("su-model").value && models.length) $("su-model").value = models[0]; }
window.testAI = async b => {
  b.disabled = true; $("su-ai-res").textContent = "…";
  const r = await (await fetch("api/setup/test-ai", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({backend: $("su-backend").value, url: $("su-url").value, api_key: $("su-key").value})})).json();
  b.disabled = false;
  $("su-ai-res").textContent = r.ok ? T("su.ai_ok", {n: r.models.length}) : T("su.ai_bad", {e: r.error});
  if (r.ok) fillModels(r.models);
};
window.discoverAI = async b => {
  b.disabled = true; b.textContent = T("su.scanning"); $("su-found").innerHTML = "";
  try { const r = await (await fetch("api/setup/discover", {method:"POST"})).json();
    SU.found = r.found;
    $("su-found").innerHTML = r.found.length ? r.found.map((f, i) => `<span class="chip found" onclick="pickAI(${i})">${esc(f.backend === "ollama" ? "Ollama" : "OpenAI")} · ${esc(f.url)} · ${T("su.found_models", {n: f.models.length})}</span>`).join("")
      : `<span class="muted">${T("su.found_none")}</span>`;
    if (r.found.length === 1) pickAI(0);
  } finally { b.disabled = false; b.textContent = T("su.scan"); }
};
window.pickAI = i => { const f = SU.found[i]; $("su-backend").value = f.backend; aiBackend(true); $("su-url").value = f.url; fillModels(f.models);
  $("su-ai-res").textContent = T("su.ai_ok", {n: f.models.length}); };
window.saveSetup = async () => {
  const ol = $("su-backend").value === "ollama";
  const ai = {backend: $("su-backend").value, model: $("su-model").value.trim(), num_ctx: $("su-ctx").value};
  ai[ol ? "ollama_url" : "openai_url"] = $("su-url").value.trim();
  if ($("su-key").value) ai.api_key = $("su-key").value;
  const r = await post("api/setup/save", {options: {notify_services: collect("su-notify"), persons: collect("su-persons"),
    site_context: $("su-site").value, language: $("su-lang").value, assistant: ai}});
  if (!r.ok) return;
  $("overlay").style.display = "flex";
  let down = false; const t0 = Date.now();
  const poll = setInterval(async () => {
    try { const h = await fetch("api/health", {cache: "no-store"}); if (!h.ok) throw 0; if (down || Date.now() - t0 > 20000) { clearInterval(poll); location.reload(); } }
    catch (e) { down = true; }
  }, 2000);
};
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
